    proxy_set_header X-Forwarded-For $remote_addr;
    location = /api/login { limit_req zone=private_apps_login burst=5 nodelay; proxy_pass http://127.0.0.1:3112; }
    location / { proxy_pass http://127.0.0.1:3112; }
}

