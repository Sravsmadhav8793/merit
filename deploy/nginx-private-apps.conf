limit_req_zone $binary_remote_addr zone=private_apps_login:10m rate=5r/m;

server {
    listen 80;
    server_name quantum.sravantix.com merit.sravantix.com roktara.sravantix.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name quantum.sravantix.com;
    ssl_certificate /etc/letsencrypt/live/quantum.sravantix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantum.sravantix.com/privkey.pem;
    client_max_body_size 25m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    location = /api/login { limit_req zone=private_apps_login burst=5 nodelay; proxy_pass http://127.0.0.1:3111; }
    location / { proxy_pass http://127.0.0.1:3111; }
}

server {
    listen 443 ssl;
    server_name merit.sravantix.com;
    ssl_certificate /etc/letsencrypt/live/merit.sravantix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merit.sravantix.com/privkey.pem;
